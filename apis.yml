aid: iman
name: Iman
description: >-
  IMAN (mobile app IMANUM, operated by IMAN CAPITAL LTD) is a halal fintech and
  Islamic-finance super-app serving Muslim-majority, largely unbanked markets in
  Central Asia. Headquartered in Uzbekistan and expanding into Kazakhstan,
  Pakistan, South Asia and MENA, IMAN bundles Sharia-compliant financial products
  into a single consumer app: IMAN Invest, a faith-based investing platform where
  users and IMAN enter Mudarabah contracts to finance real trade in goods, and
  IMAN Pay, an interest-free buy-now-pay-later / point-of-sale installment
  product for the previously unbanked. All services are certified compliant with
  Islamic finance principles by scholars including the Muslim Board of Uzbekistan.
  IMAN was the first Central Asian startup backed by 500 Global and has raised
  over $6M from strategic and institutional investors.
